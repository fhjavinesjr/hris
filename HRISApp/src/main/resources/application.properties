# Server Configuration
server.port=${PORT:9090}
spring.application.name=HRISAppSoftware

# Combined HRISApp service discovery
hris.services.base.url=${HRIS_SERVICES_BASE_URL:http://localhost:${server.port}}
hris.services.administrative.url=${HRIS_SERVICES_ADMINISTRATIVE_URL:${hris.services.base.url}}
hris.services.hrmanagement.url=${HRIS_SERVICES_HRMANAGEMENT_URL:${hris.services.base.url}}
hris.services.timekeeping.url=${HRIS_SERVICES_TIMEKEEPING_URL:${hris.services.base.url}}

# PostgreSQL / Neon cloud database
spring.datasource.url=${HRIS_POSTGRES_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${HRIS_POSTGRES_USERNAME}
spring.datasource.password=${HRIS_POSTGRES_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ADMS does not exist in the PostgreSQL/Neon deployment.
adms.sync.enabled=false
adms.sync.database-name=adms_db
adms.sync.batch-size=1000
adms.sync.max-records-per-run=10000

# SecurityConfig.java
app.cors.allowed-origins=http://localhost:3087,http://localhost:3080,http://localhost:3081,http://localhost:3082,http://localhost:3083,http://localhost:3084,http://localhost:3085,https://hris-znce.onrender.com
app.cors.allowed-origin-patterns=https://*.vercel.app
