# Run combined HRISApp locally with:
#   --spring.profiles.active=sqlserver

spring.datasource.url=${HRIS_DB_URL:jdbc:sqlserver://localhost:1433;database=hrisof;trustServerCertificate=true;encrypt=true;}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${HRIS_DB_USERNAME:admin}
spring.datasource.password=${HRIS_DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ZKTeco/iClock ADMS exists only in the local SQL Server instance.
adms.sync.enabled=true
adms.sync.database-name=adms_db
adms.sync.batch-size=1000
adms.sync.max-records-per-run=10000
