  /performance-management/objectives/{versionId}:
    get: {operationId: getPerformanceObjective, responses: {'200': {description: Exact objective version}}}
    put: {operationId: updatePerformanceObjective, responses: {'200': {description: Draft objective updated}}}
  /performance-management/objectives/{versionId}/revisions:
    post: {operationId: createPerformanceObjectiveRevision, responses: {'201': {description: Successor draft created}}}
  /performance-management/objectives/{versionId}/publish:
    post: {operationId: publishPerformanceObjective, responses: {'200': {description: Objective published after source and hierarchy validation}}}
  /performance-management/objectives/{versionId}/retire:
    post: {operationId: retirePerformanceObjective, responses: {'200': {description: Objective retired}}}
  /performance-management/objectives/{versionId}/readiness:
