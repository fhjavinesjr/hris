  /operations/legal-holds/{id}/release:
    post: {operationId: releaseLegalHold, parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Legal hold released}, '409': {$ref: '#/components/responses/Conflict'}}}
  /operations/retention-eligibility:
    get:
      operationId: getRetentionEligibilityReport
      parameters: [{name: asOf, in: query, required: true, schema: {type: string, format: date}}]
