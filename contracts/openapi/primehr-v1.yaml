  /performance-management/commitments/{versionId}:
    get: {operationId: getPerformanceCommitment, responses: {'200': {description: Exact scope-authorized commitment snapshot}}}
  /performance-management/commitments/{versionId}/targets:
    put: {operationId: replacePerformanceCommitmentTargets, responses: {'200': {description: Atomic structured target replacement}}}
  /performance-management/commitments/{versionId}/cascades:
    put: {operationId: replacePerformanceCommitmentCascades, responses: {'200': {description: Atomic exact-version cascade replacement}}}
  /performance-management/commitments/{versionId}/readiness:
    get: {operationId: getPerformanceCommitmentReadiness, responses: {'200': {description: Non-transitioning composition readiness}}}
  /performance-management/commitments/{versionId}/workflow:
    get: {operationId: getPerformanceCommitmentWorkflow, responses: {'200': {description: Scope-authorized route and action history}}}
  /performance-management/commitments/{versionId}/submit:
    post: {operationId: submitPerformanceCommitment, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceCommitmentWorkflowCommand'}}}}, responses: {'200': {description: Submitted with an immutable approval-route snapshot}, '409': {$ref: '#/components/responses/Conflict'}}}
  /performance-management/commitments/{versionId}/withdraw:
    post: {operationId: withdrawPerformanceCommitment, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceCommitmentWorkflowCommand'}}}}, responses: {'200': {description: Withdrawn before the first route decision}, '409': {$ref: '#/components/responses/Conflict'}}}
  /performance-management/commitments/{versionId}/recommend:
    post: {operationId: recommendPerformanceCommitment, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceCommitmentWorkflowCommand'}}}}, responses: {'200': {description: Recommended by the exact current intermediate actor}, '409': {$ref: '#/components/responses/Conflict'}}}
  /performance-management/commitments/{versionId}/return:
    post: {operationId: returnPerformanceCommitment, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceCommitmentWorkflowCommand'}}}}, responses: {'200': {description: Returned by the exact current route actor}, '409': {$ref: '#/components/responses/Conflict'}}}
  /performance-management/commitments/{versionId}/approve:
    post: {operationId: approvePerformanceCommitment, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceCommitmentWorkflowCommand'}}}}, responses: {'200': {description: Finally approved by the exact final actor}, '409': {$ref: '#/components/responses/Conflict'}}}
  /performance-management/commitments/{versionId}/reject:
    post: {operationId: rejectPerformanceCommitment, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceCommitmentWorkflowCommand'}}}}, responses: {'200': {description: Finally rejected by the exact final actor}, '409': {$ref: '#/components/responses/Conflict'}}}
  /performance-management/commitments/{versionId}/amendments:
    post: {operationId: createPerformanceCommitmentAmendment, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceCommitmentAmendmentCommand'}}}}, responses: {'201': {description: Amendment draft successor of an approved version}, '409': {$ref: '#/components/responses/Conflict'}}}
  /performance-management/commitments/{versionId}/void:
    post: {operationId: voidPerformanceCommitment, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceCommitmentWorkflowCommand'}}}}, responses: {'200': {description: Exceptionally voided without deleting history}, '409': {$ref: '#/components/responses/Conflict'}}}
  /performance-management/commitments/{versionId}/route-rebase:
    post: {operationId: rebasePerformanceCommitmentRoute, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PerformanceCommitmentWorkflowCommand'}}}}, responses: {'200': {description: Rebased before the first route decision}, '409': {$ref: '#/components/responses/Conflict'}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Active:
      name: active
      in: query
      description: True selects active/effective records; false selects disabled, future, or expired records; omission returns all.
      schema: {type: boolean}
    AsOf:
      name: asOf
      in: query
      description: Effectivity evaluation date; defaults to the service's current date.
      schema: {type: string, format: date}
    Status: {name: status, in: query, schema: {type: string, enum: [DRAFT, ACTIVE, ARCHIVED]}}
    Search: {name: search, in: query, schema: {type: string}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    CategoryId: {name: categoryId, in: query, schema: {type: string, maxLength: 36}}
    Id: {name: id, in: path, required: true, schema: {type: string, maxLength: 36}}
    ScaleId: {name: scaleId, in: path, required: true, schema: {type: string, maxLength: 36}}
    LevelId: {name: levelId, in: path, required: true, schema: {type: string, maxLength: 36}}
    CompetencyId: {name: competencyId, in: path, required: true, schema: {type: string, maxLength: 36}}
    IndicatorId: {name: indicatorId, in: path, required: true, schema: {type: string, maxLength: 36}}
    RequirementId: {name: requirementId, in: path, required: true, schema: {type: string, maxLength: 36}}
    AggregateType: {name: aggregateType, in: query, required: true, schema: {type: string}}
    AggregateId: {name: aggregateId, in: query, required: true, schema: {type: string, maxLength: 36}}
    RspReportFrom: {name: from, in: query, required: true, schema: {type: string, format: date}}
    RspReportTo: {name: to, in: query, required: true, schema: {type: string, format: date}}
    RspReportDateBasis: {name: dateBasis, in: query, schema: {type: string, enum: [PUBLICATION_DATE, PUBLICATION_CLOSING_DATE, PROCEEDING_FINALIZATION_DATE, SELECTION_FINALIZATION_DATE, HANDOFF_ACKNOWLEDGMENT_DATE], default: PUBLICATION_CLOSING_DATE}}
    RspReportHistory: {name: includeHistory, in: query, schema: {type: boolean, default: false}}
    RspPublicationStatus: {name: publicationStatus, in: query, schema: {type: string, enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, PUBLISHED, CLOSED, CANCELLED]}}
    RspProceedingStatus: {name: proceedingStatus, in: query, schema: {type: string, enum: [DRAFT, OPEN, IN_ASSESSMENT, FOR_DELIBERATION, FINALIZED, CANCELLED]}}
    RspSelectionStatus: {name: selectionStatus, in: query, schema: {type: string, enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, FINALIZED, CANCELLED, SUPERSEDED]}}
    RspSelectionOutcome: {name: outcome, in: query, schema: {type: string, enum: [SELECTED, NO_SELECTION, DEFERRED]}}
    RspJobPositionId: {name: jobPositionId, in: query, schema: {type: integer, format: int64, minimum: 1}}
    RspPlantillaId: {name: plantillaId, in: query, schema: {type: integer, format: int64, minimum: 1}}
    RspAreaId: {name: areaId, in: query, description: Resolved to Business Units through the authenticated Administrative organization contract., schema: {type: integer, format: int64, minimum: 1}}
    RspBusinessUnitId: {name: businessUnitId, in: query, schema: {type: integer, format: int64, minimum: 1}}
  requestBodies:
    CategoryDraft: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryDraftRequest'}}}}
    ScaleDraft: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScaleDraftRequest'}}}}
    LevelDraft: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LevelDraftRequest'}}}}
    CompetencyDraft: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompetencyDraftRequest'}}}}
    IndicatorDraft: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorDraftRequest'}}}}
    Transition: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransitionRequest'}}}}
    Publish: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublishDefinitionRequest'}}}}
    CreatePositionProfile: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePositionProfileRequest'}}}}
    UpdatePositionProfile: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePositionProfileRequest'}}}}
    CreatePositionRequirement: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePositionRequirementRequest'}}}}
    UpdatePositionRequirement: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePositionRequirementRequest'}}}}
    RequirementTransition: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PositionRequirementTransitionRequest'}}}}
    SubmitPositionProfile: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubmitPositionProfileRequest'}}}}
    ApprovePositionProfile: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovePositionProfileRequest'}}}}
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: Missing or invalid employee JWT
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: Authenticated identity lacks Competency read permission or a trusted agency context
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Agency-scoped definition was not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict: {description: Optimistic conflict or illegal lifecycle transition, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    AuthorizationUnavailable: {description: Administrative authorization could not be verified, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    PositionTargetUnavailable: {description: The authoritative Administrative position target could not be verified, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    HumanResourceUnavailable: {description: The authenticated authoritative HumanResource employee or active-employment contract could not be verified; the PMT mutation fails closed, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    AdminRecord: {description: Agency-scoped administration record, content: {application/json: {schema: {$ref: '#/components/schemas/AdminRecord'}}}}
    AdminPage: {description: Page of agency-scoped administration records, content: {application/json: {schema: {$ref: '#/components/schemas/AdminPage'}}}}
    PositionProfileRecord: {description: Versioned position competency profile, content: {application/json: {schema: {$ref: '#/components/schemas/PositionProfile'}}}}
    PositionProfilePage: {description: Page of position competency profile versions, content: {application/json: {schema: {$ref: '#/components/schemas/PositionProfilePage'}}}}
    PositionProfileResolution: {description: Effective profile selected by Plantilla-then-Job Position precedence, content: {application/json: {schema: {$ref: '#/components/schemas/PositionProfileResolution'}}}}
    PositionProfileComparison: {description: Exact-version requirement comparison, content: {application/json: {schema: {$ref: '#/components/schemas/PositionProfileComparison'}}}}
    AuditEventPage: {description: Page of append-only position-profile audit events, content: {application/json: {schema: {$ref: '#/components/schemas/AuditEventPage'}}}}
  schemas:
    PerformanceCommitmentWorkflowCommand:
      type: object
      required: [recordVersion, contentRevision, lifecycleRevision, requestKey, overrideWindow]
      properties:
        recordVersion: {type: integer, format: int64, minimum: 0}
        contentRevision: {type: integer, minimum: 0}
        lifecycleRevision: {type: integer, minimum: 0}
        routeRevision: {type: integer, minimum: 1, nullable: true}
        requestKey: {type: string, maxLength: 100}
        reason: {type: string, maxLength: 2000, nullable: true}
        overrideWindow: {type: boolean}
        overrideMilestone: {type: string, maxLength: 80, nullable: true}
    PerformanceCommitmentAmendmentCommand:
      type: object
      required: [recordVersion, requestKey, reason]
      properties:
        recordVersion: {type: integer, format: int64, minimum: 0}
        requestKey: {type: string, maxLength: 100}
        reason: {type: string, maxLength: 2000}
    PerformanceTemplateFormType: {type: string, enum: [OPCR, DPCR, IPCR, CUSTOM]}
    PerformanceTemplateSectionType: {type: string, enum: [CORE, STRATEGIC, SUPPORT, OTHER]}
    PerformanceTemplateStatus: {type: string, enum: [DRAFT, PUBLISHED, RETIRED]}
    PerformanceTemplateInput: {type: object, required: [code, title, formType, policyVersionId, ratingScaleVersionId, formLabel, legalBasis]}
    PerformanceTemplateItemInput: {type: object, required: [indicatorVersionId, weightPercent, required, displayOrder]}
    PerformanceTemplateSectionInput: {type: object, required: [type, code, title, weightPercent, displayOrder, items]}
    PerformanceTemplateStructureInput: {type: object, required: [recordVersion, sections]}
    PerformanceTemplateReadiness: {type: object, required: [ready, errors]}
    PerformanceTemplatePreviewInput: {type: object, required: [scores]}
    PerformanceTemplatePreview: {type: object, required: [overallScore, ratingBandId, ratingLabel, sections, formula]}
    PerformanceDimensionType: {type: string, enum: [QUALITY, EFFICIENCY, TIMELINESS, AGENCY_DEFINED]}
    PerformanceRubricOperator: {type: string, enum: [LT, LTE, EQ, GTE, GT, BETWEEN, MANUAL_CRITERIA]}
    PerformanceSuccessIndicatorStatus: {type: string, enum: [DRAFT, PUBLISHED, RETIRED]}
    PerformanceDefinitionTransition: {type: object, required: [recordVersion, reason], properties: {recordVersion: {type: integer, format: int64}, reason: {type: string, maxLength: 1000}, effectiveFrom: {type: string, format: date, nullable: true}, effectiveTo: {type: string, format: date, nullable: true}}}
    PerformanceSuccessIndicatorInput: {type: object, required: [code, title, outputDescription, keyResultArea, performanceIndicator, successStatement, policyVersionId, ratingScaleVersionId, measureType, unitOfMeasure, direction, requiresEvidence]}
    PerformanceIndicatorLevelInput: {type: object, required: [ratingBandId, operator]}
    PerformanceIndicatorDimensionInput: {type: object, required: [type, code, label, weightPercent, displayOrder, levels]}
    PerformanceIndicatorDimensionsInput: {type: object, required: [recordVersion, dimensions]}
    PerformanceSuccessIndicatorPreviewInput: {type: object, required: [actuals]}
    PerformanceSuccessIndicatorPreview: {type: object, required: [indicatorScore, dimensions, formula]}
    PerformanceMeasureType: {type: string, enum: [COUNT, NUMBER, PERCENTAGE, CURRENCY, DURATION, DATE_MILESTONE, BOOLEAN, MANUAL_RUBRIC]}
    PerformanceMeasureDirection: {type: string, enum: [HIGHER_IS_BETTER, LOWER_IS_BETTER, EXACT_TARGET, WITHIN_RANGE, MANUAL_RUBRIC]}
    PerformanceDimensionScoreSource: {type: string, enum: [THRESHOLD_BAND, MANUAL_RUBRIC]}
    PerformanceRoundingMode: {type: string, enum: [HALF_UP, HALF_EVEN, DOWN]}
    PerformanceRatingScaleStatus: {type: string, enum: [DRAFT, PUBLISHED, RETIRED]}
    PerformanceRatingScaleInput:
      type: object
      required: [code, title, legalBasis, policyVersionId, minimumScore, maximumScore, roundingScale, roundingMode, measureType, direction, dimensionScoreSource]
      properties:
        code: {type: string, maxLength: 80}
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 2000, nullable: true}
        legalBasis: {type: string, maxLength: 1000}
        policyVersionId: {type: string, maxLength: 36}
        minimumScore: {type: number}
        maximumScore: {type: number}
        roundingScale: {type: integer, minimum: 0, maximum: 6}
        roundingMode: {$ref: '#/components/schemas/PerformanceRoundingMode'}
        measureType: {$ref: '#/components/schemas/PerformanceMeasureType'}
        direction: {$ref: '#/components/schemas/PerformanceMeasureDirection'}
        dimensionScoreSource: {$ref: '#/components/schemas/PerformanceDimensionScoreSource'}
        recordVersion: {type: integer, format: int64, nullable: true}
    PerformanceRatingBandInput:
      type: object
      required: [code, numericScore, label, lowerBound, upperBound, displayOrder]
      properties:
        code: {type: string, maxLength: 80}
        numericScore: {type: number}
        label: {type: string, maxLength: 200}
        lowerBound: {type: number}
        upperBound: {type: number}
        displayOrder: {type: integer, minimum: 1}
        guidance: {type: string, maxLength: 2000, nullable: true}
    PerformanceRatingBandsInput:
      type: object
      required: [recordVersion, bands]
      properties:
        recordVersion: {type: integer, format: int64}
        bands: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PerformanceRatingBandInput'}}
    PerformanceRatingScalePublish:
      type: object
      required: [recordVersion, effectiveFrom, reason]
      properties:
        recordVersion: {type: integer, format: int64}
        effectiveFrom: {type: string, format: date}
        effectiveTo: {type: string, format: date, nullable: true}
        reason: {type: string, maxLength: 1000}
    PerformanceRatingPreviewInput:
      type: object
      required: [sampleValue]
      properties: {sampleValue: {type: number}}
    PerformanceRatingPreview:
      type: object
      required: [inputValue, roundedScore, roundingUnit, matchedBandCode, matchedBandLabel, numericScore, calculation]
      properties:
        inputValue: {type: number}
        roundedScore: {type: number}
        roundingUnit: {type: number}
        matchedBandCode: {type: string, maxLength: 80}
        matchedBandLabel: {type: string, maxLength: 200}
        numericScore: {type: number}
        calculation: {type: string}
    PerformancePolicyFrequency: {type: string, enum: [ANNUAL, SEMI_ANNUAL, QUARTERLY, CUSTOM]}
    PerformancePolicyStatus: {type: string, enum: [DRAFT, PUBLISHED, RETIRED]}
    PerformancePolicyInput:
      type: object
      required: [code, title, legalBasis, displayLabel, cycleFrequency]
      properties:
        code: {type: string, maxLength: 80}
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 2000, nullable: true}
        legalBasis: {type: string, maxLength: 1000}
        displayLabel: {type: string, maxLength: 120}
        cycleFrequency: {$ref: '#/components/schemas/PerformancePolicyFrequency'}
        requiresMidCycleReview: {type: boolean}
        requiresSelfAssessment: {type: boolean}
        requiresPmtCalibration: {type: boolean}
        requiresAcknowledgment: {type: boolean}
        requiresAppeal: {type: boolean}
        recordVersion: {type: integer, format: int64, nullable: true}
    PerformancePolicyPublish:
      type: object
      required: [recordVersion, effectiveFrom, reason]
