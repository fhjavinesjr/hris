openapi: 3.0.3
info:
  title: ISOFT PRIME-HRM API
  version: 6.8.0-phase-6c.3
  description: Governed Performance Management objectives, assignments, immutable commitment composition, exact-version cascading, route snapshots, and auditable commitment approval lifecycles. Accomplishments, ratings, calibration, coaching, reports, and Phase 6C UI remain excluded.
servers:
  - url: /api/primehr/v1
security:
  - bearerAuth: []
paths:
  /public/v1/privacy-notices/current:
    servers: [{url: /api/primehr}]
    get: {operationId: getCurrentApplicantPrivacyNotice, security: [], responses: {'200': {description: Current effective privacy notice}, '404': {$ref: '#/components/responses/NotFound'}}}
  /public/v1/applicant-accounts/register:
    servers: [{url: /api/primehr}]
    post: {operationId: registerApplicant, security: [], responses: {'201': {description: Applicant account registered with consent evidence}, '400': {$ref: '#/components/responses/BadRequest'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /public/v1/applicant-sessions:
    servers: [{url: /api/primehr}]
    post: {operationId: createApplicantSession, security: [], responses: {'200': {description: Isolated applicant bearer session}, '401': {$ref: '#/components/responses/Unauthorized'}}}
  /public/v1/vacancies:
    servers: [{url: /api/primehr}]
    get: {operationId: listPublicVacancies, security: [], responses: {'200': {description: Currently open published vacancies only}}}
  /public/v1/vacancies/{publicationId}:
    servers: [{url: /api/primehr}]
    get: {operationId: getPublicVacancy, security: [], responses: {'200': {description: Published vacancy detail}, '404': {$ref: '#/components/responses/NotFound'}}}
  /applicant/v1/me:
    servers: [{url: /api/primehr}]
    get: {operationId: getApplicantAccount, responses: {'200': {description: Authenticated applicant account}, '401': {$ref: '#/components/responses/Unauthorized'}}}
    put: {operationId: updateApplicantAccount, responses: {'200': {description: Applicant account updated}, '400': {$ref: '#/components/responses/BadRequest'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/session:
    servers: [{url: /api/primehr}]
    delete: {operationId: deleteApplicantSession, responses: {'204': {description: Stateless applicant logout acknowledged}}}
  /applicant/v1/me/profile:
    servers: [{url: /api/primehr}]
    get: {operationId: getApplicantProfile, responses: {'200': {description: Applicant-owned profile}}}
    put: {operationId: updateApplicantProfile, responses: {'200': {description: Applicant-owned profile updated}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/consents:
    servers: [{url: /api/primehr}]
    post: {operationId: acceptCurrentPrivacyNotice, responses: {'204': {description: Current notice acceptance recorded}}}
  /applicant/v1/me/documents:
    servers: [{url: /api/primehr}]
    get: {operationId: listApplicantDocuments, responses: {'200': {description: Applicant-owned active documents}}}
    post: {operationId: uploadApplicantDocument, responses: {'201': {description: Private applicant document stored}}}
  /applicant/v1/me/documents/{documentId}:
    servers: [{url: /api/primehr}]
    delete: {operationId: deactivateApplicantDocument, responses: {'204': {description: Applicant-owned document deactivated}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/documents/{documentId}/content:
    servers: [{url: /api/primehr}]
    get: {operationId: downloadApplicantDocument, responses: {'200': {description: Applicant-owned document content}, '404': {$ref: '#/components/responses/NotFound'}}}
  /applicant/v1/me/documents/{documentId}/replace:
    servers: [{url: /api/primehr}]
    post: {operationId: replaceApplicantDocument, responses: {'201': {description: Applicant-owned document replaced atomically}}}
  /applicant/v1/me/applications:
    servers: [{url: /api/primehr}]
    get: {operationId: listOwnApplications, responses: {'200': {description: Applicant-owned applications only}}}
    post: {operationId: createApplicationDraft, responses: {'200': {description: Application draft created}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/applications/{applicationId}:
    servers: [{url: /api/primehr}]
    get: {operationId: getOwnApplication, responses: {'200': {description: Applicant-owned application}, '404': {$ref: '#/components/responses/NotFound'}}}
    put: {operationId: updateOwnApplicationDraft, responses: {'200': {description: Draft document selection updated}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/applications/{applicationId}/submit:
    servers: [{url: /api/primehr}]
    post: {operationId: submitOwnApplication, responses: {'200': {description: Immutable application evidence submitted atomically}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/applications/{applicationId}/withdraw:
    servers: [{url: /api/primehr}]
    post: {operationId: withdrawOwnApplication, responses: {'200': {description: Submitted application withdrawn without deleting evidence}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/applications/{applicationId}/communications:
    servers: [{url: /api/primehr}]
    get: {operationId: listOwnApplicationCommunications, responses: {'200': {description: Applicant-safe communication history}}}
  /rsp/applications:
    get: {operationId: listApplicantIntake, responses: {'200': {description: Authorized agency-wide applicant intake page}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/applications/{applicationId}:
    get: {operationId: getApplicantIntake, responses: {'200': {description: Authorized applicant submission evidence}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/applications/{applicationId}/documents/{documentId}/content:
    get: {operationId: downloadApplicantIntakeDocument, responses: {'200': {description: Audited authorized evidence stream}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/applications/{applicationId}/communications:
    get: {operationId: listApplicantIntakeCommunications, responses: {'200': {description: Authorized communication history}}}
    post: {operationId: sendApplicantIntakeMessage, responses: {'200': {description: Audited informational portal message}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/screening-policies:
    get: {operationId: listScreeningPolicies, responses: {'200': {description: Agency-wide versioned screening policy page}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {operationId: createScreeningPolicyDraft, responses: {'201': {description: Screening policy draft created}, '400': {$ref: '#/components/responses/BadRequest'}}}
  /rsp/screening-policies/{policyId}:
    get: {operationId: getScreeningPolicy, responses: {'200': {description: Exact screening policy version}, '404': {$ref: '#/components/responses/NotFound'}}}
    put: {operationId: updateScreeningPolicyDraft, responses: {'200': {description: Screening policy draft updated}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-policies/{policyId}/publish:
    post: {operationId: publishScreeningPolicy, responses: {'200': {description: Immutable screening policy version published}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-policies/{policyId}/successors:
    post: {operationId: createScreeningPolicySuccessor, responses: {'201': {description: Successor draft created from a published version}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-policies/{policyId}/preview:
    post: {operationId: previewStructuredScreeningChecks, responses: {'200': {description: Transparent advisory checks requiring human confirmation}}}
  /rsp/vacancy-publications/{publicationId}/screening-policy:
    put: {operationId: bindVacancyScreeningPolicy, responses: {'200': {description: Exact immutable vacancy-to-policy binding}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-cases:
    get: {operationId: listPermittedScreeningCases, responses: {'200': {description: Assigned or administrator-permitted screening cases}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/applications/{applicationId}/screening-cases:
    post: {operationId: openScreeningCase, responses: {'201': {description: Assigned case opened from immutable application and policy evidence}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-cases/{caseId}:
    get: {operationId: getScreeningCase, responses: {'200': {description: Authorized case findings and evidence}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/screening-cases/{caseId}/successors:
    post: {operationId: createScreeningCorrection, responses: {'201': {description: Controlled correction revision preserving final history}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-cases/{caseId}/assignments:
    put: {operationId: assignScreeningCase, responses: {'200': {description: Distinct screener and validator assigned}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-cases/{caseId}/findings/{criterionId}:
    put: {operationId: recordScreeningFinding, responses: {'200': {description: Human-confirmed finding with immutable evidence links}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-cases/{caseId}/submit:
    post: {operationId: submitScreeningRecommendation, responses: {'200': {description: Complete consistent recommendation submitted}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-cases/{caseId}/return:
    post: {operationId: returnScreeningCase, responses: {'200': {description: Independent validator returned the recommendation}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/screening-cases/{caseId}/finalize:
    post: {operationId: finalizeScreeningCase, responses: {'200': {description: Independent immutable decision finalized}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/screening-cases/{caseId}/override:
    post: {operationId: overrideScreeningCase, responses: {'200': {description: Administrator-only reasoned override}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/screening-cases/{caseId}/history:
    get: {operationId: getScreeningCaseHistory, responses: {'200': {description: Immutable screening revision history}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/evaluation-policies:
    get: {operationId: listEvaluationPolicies, responses: {'200': {description: Agency-wide versioned evaluation policy page}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {operationId: createEvaluationPolicyDraft, responses: {'201': {description: Evaluation policy draft created}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation-policies/{policyId}:
    get: {operationId: getEvaluationPolicy, responses: {'200': {description: Exact evaluation policy version}, '403': {$ref: '#/components/responses/Forbidden'}}}
    put: {operationId: updateEvaluationPolicyDraft, responses: {'200': {description: Evaluation policy draft updated}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation-policies/{policyId}/publish:
    post: {operationId: publishEvaluationPolicy, responses: {'200': {description: Immutable evaluation policy version published}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation-policies/{policyId}/successors:
    post: {operationId: createEvaluationPolicySuccessor, responses: {'201': {description: Successor evaluation policy draft created}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/vacancy-publications/{publicationId}/evaluation-policy:
    put: {operationId: bindEvaluationPolicy, responses: {'200': {description: Exact published evaluation policy bound to vacancy}, '409': {$ref: '#/components/responses/Conflict'}}}
  /committees:
    get: {operationId: listCommittees, responses: {'200': {description: Agency-wide HRMPSB committee versions}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {operationId: createCommitteeDraft, responses: {'201': {description: HRMPSB committee draft created}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /committees/{committeeId}:
    get: {operationId: getCommittee, responses: {'200': {description: Exact HRMPSB committee version}, '403': {$ref: '#/components/responses/Forbidden'}}}
    put: {operationId: updateCommitteeDraft, responses: {'200': {description: HRMPSB committee draft updated}, '409': {$ref: '#/components/responses/Conflict'}}}
  /committees/{committeeId}/publish:
    post: {operationId: publishCommittee, responses: {'200': {description: Effective immutable HRMPSB roster published}, '409': {$ref: '#/components/responses/Conflict'}}}
  /committees/{committeeId}/successors:
    post: {operationId: createCommitteeSuccessor, responses: {'201': {description: Successor HRMPSB committee draft created}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation-proceedings:
    get: {operationId: listAssignedEvaluationProceedings, responses: {'200': {description: Proceedings assigned to the effective HRMPSB member}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {operationId: createEvaluationProceeding, responses: {'201': {description: Exact-source evaluation proceeding draft created}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation-proceedings/{proceedingId}:
    get: {operationId: getAssignedEvaluationProceeding, responses: {'200': {description: Assigned proceeding with immutable sources and admitted candidates}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/evaluation-proceedings/{proceedingId}/candidates:
    put: {operationId: admitQualifiedEvaluationCandidates, responses: {'200': {description: Current qualified candidates admitted with immutable source snapshots}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation-proceedings/{proceedingId}/open:
    post: {operationId: openEvaluationProceeding, responses: {'200': {description: Fresh qualified candidate set frozen and proceeding opened}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation-proceedings/{proceedingId}/cancel:
    post: {operationId: cancelEvaluationProceeding, responses: {'200': {description: Draft or open proceeding cancelled with reason}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/proceedings/{proceedingId}/sessions:
    post: {operationId: createEvaluationSession, responses: {'201': {description: Controlled examination or interview session created}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/proceedings/{proceedingId}:
    get: {operationId: getEvaluationExecutionOverview, responses: {'200': {description: Permission-filtered execution, deliberation, evidence, and immutable comparison history; another member's unsubmitted rating remains private}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/evaluation/sessions/{sessionId}:
    put: {operationId: updateEvaluationSession, responses: {'200': {description: Mutable session schedule updated with optimistic locking}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/sessions/{sessionId}/{action}:
    post: {operationId: transitionEvaluationSession, responses: {'200': {description: Session scheduled, completed, or cancelled according to lifecycle}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/sessions/{sessionId}/candidates/{candidateId}/attendance:
    put: {operationId: recordEvaluationAttendance, responses: {'200': {description: Candidate attendance, no-show, excusal, or withdrawal evidence recorded}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/proceedings/{proceedingId}/assignments:
    put: {operationId: replaceEvaluationAssignments, responses: {'200': {description: Versioned examiner, validator, panel, reference-check, observer, or alternate assignments}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/evaluation/proceedings/{proceedingId}/conflicts:
    post: {operationId: declareEvaluationConflict, responses: {'201': {description: HRMPSB member conflict declaration recorded}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/conflicts/{conflictId}/resolve:
    post: {operationId: resolveEvaluationConflict, responses: {'200': {description: Independent conflict resolution recorded}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/evaluation/proceedings/{proceedingId}/stage-results:
    post: {operationId: recordStageResult, responses: {'201': {description: Examination or gate result recorded without treating missing results as zero}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/stage-results/{resultId}/{action}:
    post: {operationId: transitionStageResult, responses: {'200': {description: Result submitted, independently validated, or returned}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/proceedings/{proceedingId}/panel-ratings:
    put: {operationId: saveIndependentPanelRating, responses: {'200': {description: Assigned member-owned criterion rating saved}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/evaluation/panel-ratings/{ratingId}/{action}:
    post: {operationId: transitionPanelRating, responses: {'200': {description: Independent panel rating submitted or returned for correction}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/proceedings/{proceedingId}/reference-checks:
    post: {operationId: createReferenceCheck, responses: {'201': {description: Lawful-purpose reference check opened}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/evaluation/reference-checks/{referenceId}/complete:
    post: {operationId: completeReferenceCheck, responses: {'200': {description: Assigned checker records separated applicant-safe and confidential findings}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/reference-checks/{referenceId}/validate:
    post: {operationId: validateReferenceCheck, responses: {'200': {description: Independent validation recorded}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/proceedings/{proceedingId}/comparative-evaluations:
    post: {operationId: generateComparativeEvaluation, responses: {'201': {description: Immutable deterministic weighted scores and ranks generated for deliberation}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/proceedings/{proceedingId}/meetings:
    post: {operationId: createHrmpsbMeeting, responses: {'201': {description: HRMPSB deliberation meeting created from finalized comparative evidence}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/meetings/{meetingId}:
    put: {operationId: updateHrmpsbMeeting, responses: {'200': {description: Non-final meeting schedule, agenda, quorum, and minutes updated}}}
  /rsp/evaluation/meetings/{meetingId}/{action}:
    post: {operationId: transitionHrmpsbMeeting, responses: {'200': {description: Meeting scheduled, begun, or finalized after quorum and candidate resolution gates}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/meetings/{meetingId}/attendance:
    post: {operationId: recordHrmpsbAttendance, responses: {'200': {description: Effective committee attendance and voting eligibility recorded}}}
  /rsp/evaluation/meetings/{meetingId}/resolutions:
    post: {operationId: recordHrmpsbResolution, responses: {'200': {description: Candidate deliberation recommendation recorded without making a selection or appointment}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/evaluation/proceedings/{proceedingId}/evidence:
    post: {operationId: uploadEvaluationEvidence, responses: {'201': {description: Restricted evidence stored with signature, checksum, classification, and retention metadata}}}
  /rsp/evaluation/evidence/{evidenceId}/content:
    get: {operationId: downloadEvaluationEvidence, responses: {'200': {description: Authorized restricted evaluation evidence}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /applicant/v1/me/applications/{applicationId}/evaluation:
    servers: [{url: /api/primehr}]
    get: {operationId: getOwnApplicantSafeEvaluationStatus, responses: {'200': {description: Own schedules and coarse progress only; no scores, ranks, conflicts, confidential notes, or deliberation details}, '404': {$ref: '#/components/responses/NotFound'}}}
  /rsp/selection-cases:
    get: {operationId: listSelectionCases, responses: {'200': {description: Agency-wide authorized selection cases}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {operationId: createSelectionCase, responses: {'201': {description: Selection draft frozen from finalized Phase 5D evidence}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/selection-cases/{selectionId}:
    get: {operationId: getSelectionCase, responses: {'200': {description: Exact immutable-source selection case}, '404': {$ref: '#/components/responses/NotFound'}}}
  /rsp/selection-cases/{selectionId}/decision:
    put: {operationId: decideSelectionCase, responses: {'200': {description: Human selection, no-selection, or deferral recorded}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/selection-cases/{selectionId}/submit:
    post: {operationId: submitSelectionCase, responses: {'200': {description: Decision submitted for independent appointing-authority review}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/selection-cases/{selectionId}/return:
    post: {operationId: returnSelectionCase, responses: {'200': {description: Selection returned with reason}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/selection-cases/{selectionId}/approve:
    post: {operationId: approveSelectionCase, responses: {'200': {description: Assigned appointing authority approves the human decision}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/selection-cases/{selectionId}/finalize:
    post: {operationId: finalizeSelectionCase, responses: {'200': {description: Immutable decision and applicant-safe notices released}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/selection-cases/{selectionId}/cancel:
    post: {operationId: cancelSelectionCase, responses: {'200': {description: Non-final selection cancelled with reason}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/selection-cases/{selectionId}/successors:
    post: {operationId: createSelectionCorrection, responses: {'201': {description: Controlled successor preserving finalized history}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/applications/{applicationId}/selection:
    servers: [{url: /api/primehr}]
    get: {operationId: getOwnApplicantSafeSelectionStatus, responses: {'200': {description: Own released safe selection notice and offer status only}, '404': {$ref: '#/components/responses/NotFound'}}}
  /applicant/v1/me/applications/{applicationId}/selection/response:
    servers: [{url: /api/primehr}]
    post: {operationId: respondToOwnSelectionOffer, responses: {'200': {description: Idempotent applicant-owned accept or decline response}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/selection-cases/{selectionId}/appointment-handoffs:
    post: {operationId: createAppointmentHandoff, responses: {'201': {description: Immutable DRAFT handoff created only for a finalized selection with an accepted offer}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/appointment-handoffs/{handoffId}:
    get: {operationId: getAppointmentHandoff, responses: {'200': {description: Durable handoff and delivery-attempt history}, '404': {$ref: '#/components/responses/NotFound'}}}
  /rsp/appointment-handoffs/{handoffId}/submit:
    post: {operationId: submitAppointmentHandoff, responses: {'200': {description: Service-authenticated delivery attempted with the stable handoff id and fingerprint}}}
  /rsp/appointment-handoffs/{handoffId}/retry:
    post: {operationId: retryAppointmentHandoff, responses: {'200': {description: Same immutable payload and idempotency key delivered again}}}
  /rsp/appointment-handoffs/{handoffId}/reconcile:
    post: {operationId: reconcileAppointmentHandoff, responses: {'200': {description: HumanResource receipt recovered or its state refreshed after response loss}}}
  /rsp/reports/comparative-evaluations/{proceedingId}.pdf:
    get:
      operationId: generateFormalRspComparativeEvaluation
      description: Requires independent primehr.rsp-comparative-report agency-wide access. Only a finalized, fingerprint-consistent proceeding is rendered.
      responses:
        '200': {description: SQL-free confidential comparative-evaluation PDF, content: {application/pdf: {schema: {type: string, format: binary}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /rsp/reports/selections/{selectionId}.pdf:
    get:
      operationId: generateFormalRspSelectionProcessRecord
      description: Requires independent primehr.rsp-selection-report agency-wide access. The report ends at the HumanResource handoff receipt.
      responses:
        '200': {description: SQL-free confidential selection and appointment-process PDF, content: {application/pdf: {schema: {type: string, format: binary}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /rsp/reports/evidence-index/{selectionId}.pdf:
    get:
      operationId: generateFormalRspEvidenceIndex
      description: Requires independent primehr.rsp-evidence-index-report agency-wide access. Returns metadata only, never evidence binaries, storage keys, or signed URLs.
      responses:
        '200': {description: SQL-free confidential process-evidence metadata index PDF, content: {application/pdf: {schema: {type: string, format: binary}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /rsp/reports/register:
    get:
      operationId: getRspRegister
      description: Requires primehr.rsp-register-report agency-wide access. Paged by publications with an explicit event-date basis and optional authoritative workflow/organization filters; current revisions are the default and history is explicit.
      parameters:
        - {$ref: '#/components/parameters/RspReportFrom'}
        - {$ref: '#/components/parameters/RspReportTo'}
        - {$ref: '#/components/parameters/RspReportDateBasis'}
        - {$ref: '#/components/parameters/RspReportHistory'}
        - {$ref: '#/components/parameters/RspPublicationStatus'}
        - {$ref: '#/components/parameters/RspProceedingStatus'}
        - {$ref: '#/components/parameters/RspSelectionStatus'}
        - {$ref: '#/components/parameters/RspSelectionOutcome'}
        - {$ref: '#/components/parameters/RspJobPositionId'}
        - {$ref: '#/components/parameters/RspPlantillaId'}
        - {$ref: '#/components/parameters/RspAreaId'}
        - {$ref: '#/components/parameters/RspBusinessUnitId'}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses: {'200': {description: Typed RSP register page}, '400': {$ref: '#/components/responses/BadRequest'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /rsp/reports/register.pdf:
    get:
      operationId: generateRspRegisterPdf
      description: Same filter, revision, permission, and page semantics as the typed register endpoint.
      parameters:
        - {$ref: '#/components/parameters/RspReportFrom'}
        - {$ref: '#/components/parameters/RspReportTo'}
        - {$ref: '#/components/parameters/RspReportDateBasis'}
        - {$ref: '#/components/parameters/RspReportHistory'}
        - {$ref: '#/components/parameters/RspPublicationStatus'}
