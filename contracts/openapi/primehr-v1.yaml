        sourceKey: {type: string, maxLength: 100, nullable: true}
        thresholdValue: {type: number, nullable: true}
        thresholdUnit: {type: string, maxLength: 30, nullable: true}
        mandatory: {type: boolean}
        disqualifying: {type: boolean}
        allowsNotApplicable: {type: boolean}
        requiresRemarks: {type: boolean}
        requiresEvidence: {type: boolean}
        displayOrder: {type: integer, minimum: 0}
    ScreeningReasonCodeInput:
      type: object
      required: [code, label, publicSafeText, outcomeCompatibility, remarksRequired, displayOrder]
