openapi: 3.0.3
info:
  title: ISOFT PRIME-HRM API
  version: 5.6.0-phase-5c.2
  description: Staff PRIME-HRM APIs plus separately authenticated applicant services, versioned screening policies, assigned screening, and independently validated applicant-safe outcomes. Staff operations use an ISOFT employee JWT; applicant self-service uses an isolated applicant JWT.
servers:
  - url: /api/primehr/v1
security:
  - bearerAuth: []
paths:
  /public/v1/privacy-notices/current:
    servers: [{url: /api/primehr}]
    get: {operationId: getCurrentApplicantPrivacyNotice, security: [], responses: {'200': {description: Current effective privacy notice}, '404': {$ref: '#/components/responses/NotFound'}}}
  /public/v1/applicant-accounts/register:
    servers: [{url: /api/primehr}]
    post: {operationId: registerApplicant, security: [], responses: {'201': {description: Applicant account registered with consent evidence}, '400': {$ref: '#/components/responses/BadRequest'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /public/v1/applicant-sessions:
    servers: [{url: /api/primehr}]
    post: {operationId: createApplicantSession, security: [], responses: {'200': {description: Isolated applicant bearer session}, '401': {$ref: '#/components/responses/Unauthorized'}}}
  /public/v1/vacancies:
    servers: [{url: /api/primehr}]
    get: {operationId: listPublicVacancies, security: [], responses: {'200': {description: Currently open published vacancies only}}}
  /public/v1/vacancies/{publicationId}:
    servers: [{url: /api/primehr}]
    get: {operationId: getPublicVacancy, security: [], responses: {'200': {description: Published vacancy detail}, '404': {$ref: '#/components/responses/NotFound'}}}
  /applicant/v1/me:
    servers: [{url: /api/primehr}]
    get: {operationId: getApplicantAccount, responses: {'200': {description: Authenticated applicant account}, '401': {$ref: '#/components/responses/Unauthorized'}}}
    put: {operationId: updateApplicantAccount, responses: {'200': {description: Applicant account updated}, '400': {$ref: '#/components/responses/BadRequest'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/session:
    servers: [{url: /api/primehr}]
    delete: {operationId: deleteApplicantSession, responses: {'204': {description: Stateless applicant logout acknowledged}}}
  /applicant/v1/me/profile:
    servers: [{url: /api/primehr}]
    get: {operationId: getApplicantProfile, responses: {'200': {description: Applicant-owned profile}}}
    put: {operationId: updateApplicantProfile, responses: {'200': {description: Applicant-owned profile updated}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/consents:
    servers: [{url: /api/primehr}]
    post: {operationId: acceptCurrentPrivacyNotice, responses: {'204': {description: Current notice acceptance recorded}}}
  /applicant/v1/me/documents:
    servers: [{url: /api/primehr}]
    get: {operationId: listApplicantDocuments, responses: {'200': {description: Applicant-owned active documents}}}
    post: {operationId: uploadApplicantDocument, responses: {'201': {description: Private applicant document stored}}}
  /applicant/v1/me/documents/{documentId}:
    servers: [{url: /api/primehr}]
    delete: {operationId: deactivateApplicantDocument, responses: {'204': {description: Applicant-owned document deactivated}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/documents/{documentId}/content:
    servers: [{url: /api/primehr}]
    get: {operationId: downloadApplicantDocument, responses: {'200': {description: Applicant-owned document content}, '404': {$ref: '#/components/responses/NotFound'}}}
  /applicant/v1/me/documents/{documentId}/replace:
    servers: [{url: /api/primehr}]
    post: {operationId: replaceApplicantDocument, responses: {'201': {description: Applicant-owned document replaced atomically}}}
  /applicant/v1/me/applications:
    servers: [{url: /api/primehr}]
    get: {operationId: listOwnApplications, responses: {'200': {description: Applicant-owned applications only}}}
    post: {operationId: createApplicationDraft, responses: {'200': {description: Application draft created}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/applications/{applicationId}:
    servers: [{url: /api/primehr}]
    get: {operationId: getOwnApplication, responses: {'200': {description: Applicant-owned application}, '404': {$ref: '#/components/responses/NotFound'}}}
    put: {operationId: updateOwnApplicationDraft, responses: {'200': {description: Draft document selection updated}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/applications/{applicationId}/submit:
    servers: [{url: /api/primehr}]
    post: {operationId: submitOwnApplication, responses: {'200': {description: Immutable application evidence submitted atomically}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/applications/{applicationId}/withdraw:
    servers: [{url: /api/primehr}]
    post: {operationId: withdrawOwnApplication, responses: {'200': {description: Submitted application withdrawn without deleting evidence}, '409': {$ref: '#/components/responses/Conflict'}}}
  /applicant/v1/me/applications/{applicationId}/communications:
    servers: [{url: /api/primehr}]
    get: {operationId: listOwnApplicationCommunications, responses: {'200': {description: Applicant-safe communication history}}}
  /rsp/applications:
    get: {operationId: listApplicantIntake, responses: {'200': {description: Authorized agency-wide applicant intake page}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/applications/{applicationId}:
    get: {operationId: getApplicantIntake, responses: {'200': {description: Authorized applicant submission evidence}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/applications/{applicationId}/documents/{documentId}/content:
    get: {operationId: downloadApplicantIntakeDocument, responses: {'200': {description: Audited authorized evidence stream}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/applications/{applicationId}/communications:
    get: {operationId: listApplicantIntakeCommunications, responses: {'200': {description: Authorized communication history}}}
    post: {operationId: sendApplicantIntakeMessage, responses: {'200': {description: Audited informational portal message}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/screening-policies:
    get: {operationId: listScreeningPolicies, responses: {'200': {description: Agency-wide versioned screening policy page}, '403': {$ref: '#/components/responses/Forbidden'}}}
    post: {operationId: createScreeningPolicyDraft, responses: {'201': {description: Screening policy draft created}, '400': {$ref: '#/components/responses/BadRequest'}}}
  /rsp/screening-policies/{policyId}:
    get: {operationId: getScreeningPolicy, responses: {'200': {description: Exact screening policy version}, '404': {$ref: '#/components/responses/NotFound'}}}
    put: {operationId: updateScreeningPolicyDraft, responses: {'200': {description: Screening policy draft updated}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-policies/{policyId}/publish:
    post: {operationId: publishScreeningPolicy, responses: {'200': {description: Immutable screening policy version published}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-policies/{policyId}/successors:
    post: {operationId: createScreeningPolicySuccessor, responses: {'201': {description: Successor draft created from a published version}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-policies/{policyId}/preview:
    post: {operationId: previewStructuredScreeningChecks, responses: {'200': {description: Transparent advisory checks requiring human confirmation}}}
  /rsp/vacancy-publications/{publicationId}/screening-policy:
    put: {operationId: bindVacancyScreeningPolicy, responses: {'200': {description: Exact immutable vacancy-to-policy binding}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-cases:
    get: {operationId: listPermittedScreeningCases, responses: {'200': {description: Assigned or administrator-permitted screening cases}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/applications/{applicationId}/screening-cases:
    post: {operationId: openScreeningCase, responses: {'201': {description: Assigned case opened from immutable application and policy evidence}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-cases/{caseId}:
    get: {operationId: getScreeningCase, responses: {'200': {description: Authorized case findings and evidence}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/screening-cases/{caseId}/successors:
    post: {operationId: createScreeningCorrection, responses: {'201': {description: Controlled correction revision preserving final history}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-cases/{caseId}/assignments:
    put: {operationId: assignScreeningCase, responses: {'200': {description: Distinct screener and validator assigned}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-cases/{caseId}/findings/{criterionId}:
    put: {operationId: recordScreeningFinding, responses: {'200': {description: Human-confirmed finding with immutable evidence links}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-cases/{caseId}/submit:
    post: {operationId: submitScreeningRecommendation, responses: {'200': {description: Complete consistent recommendation submitted}, '409': {$ref: '#/components/responses/Conflict'}}}
  /rsp/screening-cases/{caseId}/return:
    post: {operationId: returnScreeningCase, responses: {'200': {description: Independent validator returned the recommendation}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/screening-cases/{caseId}/finalize:
    post: {operationId: finalizeScreeningCase, responses: {'200': {description: Independent immutable decision finalized}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/screening-cases/{caseId}/override:
    post: {operationId: overrideScreeningCase, responses: {'200': {description: Administrator-only reasoned override}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /rsp/screening-cases/{caseId}/history:
    get: {operationId: getScreeningCaseHistory, responses: {'200': {description: Immutable screening revision history}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /admin/assessment-cycles:
    get: {operationId: listAssessmentCycles, responses: {'200': {description: DRAFT assessment-cycle page}}}
    post: {operationId: createAssessmentCycle, responses: {'201': {description: DRAFT cycle created}}}
  /admin/assessment-cycles/{cycleId}:
    get: {operationId: getAssessmentCycle, responses: {'200': {description: Assessment cycle}}}
    put: {operationId: updateAssessmentCycle, responses: {'200': {description: DRAFT cycle updated}}}
  /admin/assessment-cycles/{cycleId}/archive:
    post: {operationId: archiveAssessmentCycle, responses: {'200': {description: DRAFT cycle archived}}}
  /admin/assessment-cycles/{cycleId}/open:
    post: {operationId: openAssessmentCycle, responses: {'200': {description: Fully configured cycle opened}, '409': {$ref: '#/components/responses/Conflict'}}}
  /admin/assessment-cycles/{cycleId}/close:
    post: {operationId: closeAssessmentCycle, responses: {'200': {description: OPEN cycle closed}, '409': {$ref: '#/components/responses/Conflict'}}}
  /admin/assessment-cycles/{cycleId}/tools:
    get: {operationId: listAssessmentTools, responses: {'200': {description: Cycle tools}}}
    post: {operationId: createAssessmentTool, responses: {'201': {description: DRAFT tool created}}}
  /admin/assessment-tools/{toolId}:
    get: {operationId: getAssessmentTool, responses: {'200': {description: Assessment tool}}}
    put: {operationId: updateAssessmentTool, responses: {'200': {description: DRAFT tool updated}}}
  /admin/assessment-tools/{toolId}/archive:
    post: {operationId: archiveAssessmentTool, responses: {'200': {description: DRAFT tool archived}}}
  /admin/assessment-tools/{toolId}/publish:
    post: {operationId: publishAssessmentTool, responses: {'200': {description: Complete DRAFT tool published}, '409': {$ref: '#/components/responses/Conflict'}}}
  /admin/assessment-tools/{toolId}/subjects:
    get: {operationId: listAssessmentSubjects, responses: {'200': {description: Assigned subject page}}}
    post: {operationId: addAssessmentSubject, responses: {'201': {description: DRAFT subject snapshot created}}}
  /admin/assessment-cases/{caseId}:
    get: {operationId: getAssessmentCase, responses: {'200': {description: DRAFT assessment case}}}
  /admin/assessment-cases/{caseId}/archive:
    post: {operationId: archiveAssessmentCase, responses: {'200': {description: DRAFT case archived}}}
  /admin/assessment-cases/{caseId}/assessors:
    post: {operationId: addAssessorAssignment, responses: {'201': {description: DRAFT assessor assigned}}}
  /admin/assessment-cases/{caseId}/assessors/{assignmentId}:
    put: {operationId: updateAssessorAssignment, responses: {'200': {description: DRAFT assessor assignment updated}}}
  /admin/assessment-cases/{caseId}/assessors/{assignmentId}/archive:
    post: {operationId: archiveAssessorAssignment, responses: {'200': {description: DRAFT assessor assignment archived}}}
  /assessments/mine:
    get: {operationId: listMyAssessmentAssignments, responses: {'200': {description: Assigned assessor inbox, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentInboxPage'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /assessments/{caseId}:
    get: {operationId: getMyAssessmentWork, responses: {'200': {description: Current assessor contribution only, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentWork'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /assessments/{caseId}/assignments/{assignmentId}/ratings/{competencyVersionId}:
    put:
      operationId: saveAssessmentRating
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SaveAssessmentRatingRequest'}}}
      responses: {'200': {description: Rating saved and root versions advanced}, '409': {$ref: '#/components/responses/Conflict'}}
  /assessments/{caseId}/assignments/{assignmentId}/evidence:
    post:
      operationId: createAssessmentEvidence
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateAssessmentEvidenceRequest'}}}
      responses: {'201': {description: Structured evidence created}, '409': {$ref: '#/components/responses/Conflict'}}
  /assessments/{caseId}/assignments/{assignmentId}/evidence/{evidenceId}:
    put:
      operationId: updateAssessmentEvidence
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAssessmentEvidenceRequest'}}}
      responses: {'200': {description: Structured evidence updated}, '409': {$ref: '#/components/responses/Conflict'}}
  /assessments/{caseId}/assignments/{assignmentId}/evidence/{evidenceId}/archive:
    post:
      operationId: archiveAssessmentEvidence
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentWorkTransitionRequest'}}}
      responses: {'200': {description: Structured evidence archived}, '409': {$ref: '#/components/responses/Conflict'}}
  /assessments/{caseId}/assignments/{assignmentId}/submit:
    post:
      operationId: submitAssessmentContribution
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentWorkTransitionRequest'}}}
      responses: {'200': {description: Complete contribution submitted}, '409': {$ref: '#/components/responses/Conflict'}}
  /validation/assessment-cases/{caseId}/return:
    post:
      operationId: returnAssessmentForCorrection
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReturnAssessmentCaseRequest'}}}
      responses:
        '200':
          description: Submitted contributions returned atomically for correction
          content: {application/json: {schema: {$ref: '#/components/schemas/ReturnAssessmentCaseResponse'}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {description: Publication is not APPROVED or PUBLISHED}
  /validation/assessment-cases:
    get:
      operationId: listAssessmentCasesPendingValidation
      responses: {'200': {description: Agency-scoped FOR_VALIDATION cases}, '403': {$ref: '#/components/responses/Forbidden'}}
  /validation/assessment-cases/{caseId}:
    get:
      operationId: getAssessmentCaseForValidation
      responses: {'200': {description: Requirements and separate assessor contributions, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentValidation'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /validation/assessment-cases/{caseId}/validate:
    post:
      operationId: validateAssessmentCase
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ValidateAssessmentCaseRequest'}}}
      responses: {'200': {description: Atomic validation and immutable person-profile generation}, '400': {$ref: '#/components/responses/BadRequest'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /person-profiles/me:
    get:
      operationId: getMyEffectivePersonCompetencyProfile
      parameters: [{name: asOf, in: query, required: false, schema: {type: string, format: date}}]
      responses: {'200': {description: Authenticated employee effective profile, content: {application/json: {schema: {$ref: '#/components/schemas/PersonCompetencyProfile'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /person-profiles/me/history:
    get:
      operationId: listMyPersonCompetencyProfileHistory
      responses: {'200': {description: Authenticated employee immutable profile history}}
  /person-profiles/employees/{employeeNo}:
    get:
      operationId: getEmployeeEffectivePersonCompetencyProfile
      parameters:
        - {name: employeeNo, in: path, required: true, schema: {type: string}}
        - {name: asOf, in: query, required: false, schema: {type: string, format: date}}
      responses: {'200': {description: Scope-authorized employee effective profile, content: {application/json: {schema: {$ref: '#/components/schemas/PersonCompetencyProfile'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /person-profiles/employees/{employeeNo}/history:
    get:
      operationId: listEmployeePersonCompetencyProfileHistory
      parameters: [{name: employeeNo, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Scope-authorized immutable employee profile history}, '403': {$ref: '#/components/responses/Forbidden'}}
  /person-profiles/versions/{profileVersionId}:
    get:
      operationId: getPersonCompetencyProfileVersion
      parameters: [{name: profileVersionId, in: path, required: true, schema: {type: string, maxLength: 36}}]
      responses: {'200': {description: Exact immutable profile version, content: {application/json: {schema: {$ref: '#/components/schemas/PersonCompetencyProfile'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /competency-categories:
    get:
      operationId: listCompetencyCategories
      summary: List agency-scoped competency categories
      parameters:
        - $ref: '#/components/parameters/Active'
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Ordered categories
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CompetencyCategory'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /competencies:
    get:
      operationId: listCompetencies
      summary: Search and filter agency-scoped competencies
      parameters:
        - name: categoryId
          in: query
          schema: {type: string, maxLength: 36}
        - $ref: '#/components/parameters/Active'
        - name: search
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/AsOf'
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Page ordered by display order then code
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompetencyPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /competencies/{competencyId}:
    get:
      operationId: getCompetency
      summary: Get a competency, its scale, and ordered behavioral indicators
      parameters:
        - name: competencyId
          in: path
          required: true
          schema: {type: string, maxLength: 36}
        - name: includeInactive
          in: query
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Competency detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompetencyDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Not found in the requested agency/effectivity scope
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /proficiency-scales:
    get:
      operationId: listProficiencyScales
      summary: List agency-defined proficiency scales and ordered levels
      parameters:
        - $ref: '#/components/parameters/Active'
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          description: Ordered scales and levels
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ProficiencyScale'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/competency-categories:
    get:
      operationId: adminListCompetencyCategories
      parameters: [{$ref: '#/components/parameters/Status'}, {$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/AsOf'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses: {'200': {$ref: '#/components/responses/AdminPage'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '503': {$ref: '#/components/responses/AuthorizationUnavailable'}}
    post:
      operationId: createCompetencyCategoryDraft
      requestBody: {$ref: '#/components/requestBodies/CategoryDraft'}
      responses: {'201': {$ref: '#/components/responses/AdminRecord'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '503': {$ref: '#/components/responses/AuthorizationUnavailable'}}
  /admin/competency-categories/{id}:
    put:
      operationId: updateCompetencyCategoryDraft
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/CategoryDraft'}
      responses: {'200': {$ref: '#/components/responses/AdminRecord'}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/competency-categories/{id}/versions:
    post:
      operationId: createCompetencyCategorySuccessorDraft
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/Transition'}
      responses: {'201': {$ref: '#/components/responses/AdminRecord'}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/competency-categories/{id}/archive:
    post:
      operationId: archiveCompetencyCategoryDraft
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/Transition'}
      responses: {'200': {$ref: '#/components/responses/AdminRecord'}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/competency-categories/{id}/publish:
    post:
      operationId: publishCompetencyCategoryDraft
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/Publish'}
      responses: {'200': {$ref: '#/components/responses/AdminRecord'}, '400': {$ref: '#/components/responses/BadRequest'}, '401': {$ref: '#/components/responses/Unauthorized'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}, '503': {$ref: '#/components/responses/AuthorizationUnavailable'}}
  /admin/proficiency-scales:
    get:
      operationId: adminListProficiencyScales
      parameters: [{$ref: '#/components/parameters/Status'}, {$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/AsOf'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/Size'}]
      responses: {'200': {$ref: '#/components/responses/AdminPage'}, '503': {$ref: '#/components/responses/AuthorizationUnavailable'}}
    post:
      operationId: createProficiencyScaleDraft
      requestBody: {$ref: '#/components/requestBodies/ScaleDraft'}
      responses: {'201': {$ref: '#/components/responses/AdminRecord'}, '400': {$ref: '#/components/responses/BadRequest'}}
  /admin/proficiency-scales/{id}:
    put:
      operationId: updateProficiencyScaleDraft
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/ScaleDraft'}
      responses: {'200': {$ref: '#/components/responses/AdminRecord'}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/proficiency-scales/{id}/versions:
    post:
      operationId: createProficiencyScaleSuccessorDraft
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/Transition'}
      responses: {'201': {$ref: '#/components/responses/AdminRecord'}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/proficiency-scales/{id}/archive:
    post:
      operationId: archiveProficiencyScaleDraft
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/Transition'}
      responses: {'200': {$ref: '#/components/responses/AdminRecord'}, '409': {$ref: '#/components/responses/Conflict'}}
  /admin/proficiency-scales/{id}/publish:
    post:
      operationId: publishProficiencyScaleDraft
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {$ref: '#/components/requestBodies/Publish'}
