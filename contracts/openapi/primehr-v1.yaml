  /performance-management/templates/{versionId}:
    get: {operationId: getPerformanceTemplate, responses: {'200': {description: Exact template version}}}
    put: {operationId: updatePerformanceTemplate, responses: {'200': {description: Draft metadata updated}}}
  /performance-management/templates/{versionId}/structure:
    put: {operationId: replacePerformanceTemplateStructure, responses: {'200': {description: Sections and exact indicator-version items replaced atomically}}}
  /performance-management/templates/{versionId}/revisions:
    post: {operationId: createPerformanceTemplateRevision, responses: {'201': {description: Successor draft created}}}
  /performance-management/templates/{versionId}/publish:
    post: {operationId: publishPerformanceTemplate, responses: {'200': {description: Ready immutable template published}}}
  /performance-management/templates/{versionId}/retire:
    post: {operationId: retirePerformanceTemplate, responses: {'200': {description: Template retired without deletion}}}
  /performance-management/templates/{versionId}/readiness:
    get: {operationId: getPerformanceTemplateReadiness, responses: {'200': {description: Publication readiness diagnostics}}}
  /performance-management/templates/{versionId}/preview:
    post: {operationId: previewPerformanceTemplate, responses: {'200': {description: Non-persistent section and overall weighted preview}}}
  /performance-management/objectives:
    get: {operationId: listPerformanceObjectives, responses: {'200': {description: Objective definition versions}}}
