  /notifications/me:
    get:
      operationId: listMyNotifications
      description: Authenticated-own pageable notification feed. Recipient identity comes only from the bearer principal.
      parameters:
        - {name: unreadOnly, in: query, schema: {type: boolean, default: false}}
        - {name: includeDismissed, in: query, schema: {type: boolean, default: false}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses: {'200': {description: Own notification page, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPage'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /notifications/me/unread-count:
    get:
      operationId: countMyUnreadNotifications
      responses: {'200': {description: Own unread count, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationUnreadCount'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /notifications/me/{id}/read:
    put:
      operationId: markMyNotificationRead
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationMarkRequest'}}}}
      responses: {'200': {description: Own notification marked read, content: {application/json: {schema: {$ref: '#/components/schemas/Notification'}}}}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}
  /notifications/me/read-all:
    put:
      operationId: markAllMyNotificationsRead
      responses: {'200': {description: Own active notifications marked read, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationMarkAllResult'}}}}}
  /notifications/me/{id}/dismiss:
    put:
      operationId: dismissMyInformationalNotification
      description: Dismisses only an informational notice; it never resolves or mutates the source workflow.
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationMarkRequest'}}}}
      responses: {'200': {description: Own informational notification dismissed, content: {application/json: {schema: {$ref: '#/components/schemas/Notification'}}}}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}
  /notifications/me/{id}/target:
    get:
      operationId: resolveMyNotificationTarget
      description: Revalidates the authenticated recipient and exact source assignment/lifecycle before returning a controlled route key. It never executes the source workflow.
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: Safe source-target availability, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationTargetResolution'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Active:
      name: active
      in: query
      description: True selects active/effective records; false selects disabled, future, or expired records; omission returns all.
      schema: {type: boolean}
    AsOf:
      name: asOf
      in: query
      description: Effectivity evaluation date; defaults to the service's current date.
      schema: {type: string, format: date}
    Status: {name: status, in: query, schema: {type: string, enum: [DRAFT, ACTIVE, ARCHIVED]}}
    Search: {name: search, in: query, schema: {type: string}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    CategoryId: {name: categoryId, in: query, schema: {type: string, maxLength: 36}}
    Id: {name: id, in: path, required: true, schema: {type: string, maxLength: 36}}
    ScaleId: {name: scaleId, in: path, required: true, schema: {type: string, maxLength: 36}}
    LevelId: {name: levelId, in: path, required: true, schema: {type: string, maxLength: 36}}
    CompetencyId: {name: competencyId, in: path, required: true, schema: {type: string, maxLength: 36}}
    IndicatorId: {name: indicatorId, in: path, required: true, schema: {type: string, maxLength: 36}}
    RequirementId: {name: requirementId, in: path, required: true, schema: {type: string, maxLength: 36}}
    AggregateType: {name: aggregateType, in: query, required: true, schema: {type: string}}
    AggregateId: {name: aggregateId, in: query, required: true, schema: {type: string, maxLength: 36}}
    RspReportFrom: {name: from, in: query, required: true, schema: {type: string, format: date}}
    RspReportTo: {name: to, in: query, required: true, schema: {type: string, format: date}}
    RspReportDateBasis: {name: dateBasis, in: query, schema: {type: string, enum: [PUBLICATION_DATE, PUBLICATION_CLOSING_DATE, PROCEEDING_FINALIZATION_DATE, SELECTION_FINALIZATION_DATE, HANDOFF_ACKNOWLEDGMENT_DATE], default: PUBLICATION_CLOSING_DATE}}
    RspReportHistory: {name: includeHistory, in: query, schema: {type: boolean, default: false}}
    RspPublicationStatus: {name: publicationStatus, in: query, schema: {type: string, enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, PUBLISHED, CLOSED, CANCELLED]}}
    RspProceedingStatus: {name: proceedingStatus, in: query, schema: {type: string, enum: [DRAFT, OPEN, IN_ASSESSMENT, FOR_DELIBERATION, FINALIZED, CANCELLED]}}
    RspSelectionStatus: {name: selectionStatus, in: query, schema: {type: string, enum: [DRAFT, SUBMITTED, RETURNED, APPROVED, FINALIZED, CANCELLED, SUPERSEDED]}}
    RspSelectionOutcome: {name: outcome, in: query, schema: {type: string, enum: [SELECTED, NO_SELECTION, DEFERRED]}}
    RspJobPositionId: {name: jobPositionId, in: query, schema: {type: integer, format: int64, minimum: 1}}
    RspPlantillaId: {name: plantillaId, in: query, schema: {type: integer, format: int64, minimum: 1}}
    RspAreaId: {name: areaId, in: query, description: Resolved to Business Units through the authenticated Administrative organization contract., schema: {type: integer, format: int64, minimum: 1}}
    RspBusinessUnitId: {name: businessUnitId, in: query, schema: {type: integer, format: int64, minimum: 1}}
  requestBodies:
    CategoryDraft: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryDraftRequest'}}}}
    ScaleDraft: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ScaleDraftRequest'}}}}
    LevelDraft: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LevelDraftRequest'}}}}
    CompetencyDraft: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CompetencyDraftRequest'}}}}
    IndicatorDraft: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorDraftRequest'}}}}
    Transition: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TransitionRequest'}}}}
    Publish: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PublishDefinitionRequest'}}}}
    CreatePositionProfile: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePositionProfileRequest'}}}}
    UpdatePositionProfile: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePositionProfileRequest'}}}}
    CreatePositionRequirement: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreatePositionRequirementRequest'}}}}
    UpdatePositionRequirement: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePositionRequirementRequest'}}}}
    RequirementTransition: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PositionRequirementTransitionRequest'}}}}
    SubmitPositionProfile: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SubmitPositionProfileRequest'}}}}
    ApprovePositionProfile: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovePositionProfileRequest'}}}}
  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Unauthorized:
      description: Missing or invalid employee JWT
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Forbidden:
      description: Authenticated identity lacks Competency read permission or a trusted agency context
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Agency-scoped definition was not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict: {description: Optimistic conflict or illegal lifecycle transition, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    AuthorizationUnavailable: {description: Administrative authorization could not be verified, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    PositionTargetUnavailable: {description: The authoritative Administrative position target could not be verified, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    HumanResourceUnavailable: {description: The authenticated authoritative HumanResource employee or active-employment contract could not be verified; the PMT mutation fails closed, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    AdminRecord: {description: Agency-scoped administration record, content: {application/json: {schema: {$ref: '#/components/schemas/AdminRecord'}}}}
    AdminPage: {description: Page of agency-scoped administration records, content: {application/json: {schema: {$ref: '#/components/schemas/AdminPage'}}}}
    PositionProfileRecord: {description: Versioned position competency profile, content: {application/json: {schema: {$ref: '#/components/schemas/PositionProfile'}}}}
    PositionProfilePage: {description: Page of position competency profile versions, content: {application/json: {schema: {$ref: '#/components/schemas/PositionProfilePage'}}}}
    PositionProfileResolution: {description: Effective profile selected by Plantilla-then-Job Position precedence, content: {application/json: {schema: {$ref: '#/components/schemas/PositionProfileResolution'}}}}
    PositionProfileComparison: {description: Exact-version requirement comparison, content: {application/json: {schema: {$ref: '#/components/schemas/PositionProfileComparison'}}}}
    AuditEventPage: {description: Page of append-only position-profile audit events, content: {application/json: {schema: {$ref: '#/components/schemas/AuditEventPage'}}}}
  schemas:
    NotificationSourceDomain: {type: string, enum: [COMPETENCY, RSP, PERFORMANCE, LEARNING_DEVELOPMENT, REWARDS_RECOGNITION, SUCCESSION, EVIDENCE, OPERATIONS]}
    NotificationEventCode: {type: string, enum: [ACTION_ASSIGNED, RECORD_RETURNED, OUTCOME_AVAILABLE, DUE_REMINDER]}
    NotificationKind: {type: string, enum: [ACTION_REQUIRED, INFORMATIONAL]}
    NotificationRouteKey: {type: string, enum: [COMPETENCY, RSP, PERFORMANCE, LEARNING_DEVELOPMENT, REWARDS_RECOGNITION, SUCCESSION, EVIDENCE, OPERATIONS]}
    Notification:
      type: object
      required: [id, recordVersion, sourceDomain, eventCode, kind, sourceAggregateType, sourceAggregateId, sourceRecordVersion, routeKey, title, message, actionState, createdAt]
      properties:
        id: {type: string}
        recordVersion: {type: integer, format: int64}
        sourceDomain: {$ref: '#/components/schemas/NotificationSourceDomain'}
        eventCode: {$ref: '#/components/schemas/NotificationEventCode'}
        kind: {$ref: '#/components/schemas/NotificationKind'}
        sourceAggregateType: {type: string}
        sourceAggregateId: {type: string}
        sourceRecordVersion: {type: integer, format: int64}
        routeKey: {$ref: '#/components/schemas/NotificationRouteKey'}
