spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration/primehr-intake/postgresql
spring.flyway.default-schema=${HRIS_DB_SCHEMA:public}
spring.flyway.schemas=${HRIS_DB_SCHEMA:public}
spring.flyway.placeholders.hrmSchema=${HRIS_DB_SCHEMA:public}
primehr.handoff.enabled=true
primehr.handoff.jwt-secret=${PRIMEHR_HANDOFF_JWT_SECRET}
