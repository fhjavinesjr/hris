primehr.security.jwt-secret=${PRIMEHR_JWT_SECRET:local-development-secret-change-before-production}
primehr.handoff.jwt-secret=${PRIMEHR_HANDOFF_JWT_SECRET:local-handoff-secret-change-before-production}

spring.datasource.url=${PRIMEHR_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=primehr;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${PRIMEHR_DB_USERNAME:admin}
spring.datasource.password=${PRIMEHR_DB_PASSWORD:sa}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.flyway.locations=classpath:db/migration/sqlserver
spring.flyway.default-schema=${PRIMEHR_DB_SCHEMA:dbo}
spring.flyway.schemas=${PRIMEHR_DB_SCHEMA:dbo}
spring.flyway.placeholders.primehrSchema=${PRIMEHR_DB_SCHEMA:dbo}
spring.jpa.properties.hibernate.default_schema=${PRIMEHR_DB_SCHEMA:dbo}
