primehr.security.jwt-secret=${PRIMEHR_JWT_SECRET}
primehr.agency.id=${PRIMEHR_AGENCY_ID}
primehr.administrative.base-url=${PRIMEHR_ADMINISTRATIVE_API_URL}
primehr.human-resource.base-url=${PRIMEHR_HUMAN_RESOURCE_API_URL}
primehr.cors.allowed-origins=${PRIMEHR_CORS_ALLOWED_ORIGINS}
primehr.handoff.jwt-secret=${PRIMEHR_HANDOFF_JWT_SECRET}

spring.datasource.url=${PRIMEHR_DB_URL}
spring.datasource.username=${PRIMEHR_DB_USERNAME}
spring.datasource.password=${PRIMEHR_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.default-schema=${PRIMEHR_DB_SCHEMA:public}
spring.flyway.schemas=${PRIMEHR_DB_SCHEMA:public}
spring.flyway.placeholders.primehrSchema=${PRIMEHR_DB_SCHEMA:public}
spring.jpa.properties.hibernate.default_schema=${PRIMEHR_DB_SCHEMA:public}
