spring.application.name=PrimeHR
spring.profiles.default=local-sqlserver
server.port=${PORT:8086}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
info.app.name=ISOFT PRIME-HRM
info.app.version=${PRIMEHR_RELEASE_VERSION:1.0.0}

primehr.security.jwt-secret=${PRIMEHR_JWT_SECRET:}
primehr.security.competency-reader-roles=${PRIMEHR_COMPETENCY_READER_ROLES:}
primehr.agency.id=${PRIMEHR_AGENCY_ID:DEFAULT}

primehr.applicant.enabled=${PRIMEHR_APPLICANT_ENABLED:false}
primehr.applicant.jwt-secret=${PRIMEHR_APPLICANT_JWT_SECRET:}
primehr.applicant.token-minutes=${PRIMEHR_APPLICANT_TOKEN_MINUTES:30}
primehr.applicant.maximum-failed-attempts=${PRIMEHR_APPLICANT_MAXIMUM_FAILED_ATTEMPTS:5}
primehr.applicant.lock-minutes=${PRIMEHR_APPLICANT_LOCK_MINUTES:15}
primehr.applicant.required-document-types=${PRIMEHR_APPLICANT_REQUIRED_DOCUMENT_TYPES:PDS}
primehr.applicant.allow-reapplication-after-withdrawal=${PRIMEHR_APPLICANT_ALLOW_REAPPLICATION_AFTER_WITHDRAWAL:false}

primehr.storage.enabled=${PRIMEHR_STORAGE_ENABLED:false}
primehr.storage.provider=${PRIMEHR_STORAGE_PROVIDER:local}
primehr.storage.local-root=${PRIMEHR_DOCUMENT_ROOT:}
primehr.storage.maximum-bytes=${PRIMEHR_STORAGE_MAXIMUM_BYTES:10485760}
primehr.storage.allowed-media-types=${PRIMEHR_STORAGE_ALLOWED_MEDIA_TYPES:application/pdf,image/jpeg,image/png}
primehr.storage.s3-bucket=${PRIMEHR_DOCUMENT_BUCKET:}
primehr.storage.s3-region=${PRIMEHR_DOCUMENT_REGION:ap-southeast-1}
primehr.storage.s3-endpoint=${PRIMEHR_DOCUMENT_ENDPOINT:}
primehr.reconciliation.scheduling-enabled=${PRIMEHR_RECONCILIATION_SCHEDULING_ENABLED:false}
primehr.reconciliation.fixed-delay-millis=${PRIMEHR_RECONCILIATION_FIXED_DELAY_MILLIS:86400000}
primehr.reconciliation.service-token=${PRIMEHR_RECONCILIATION_SERVICE_TOKEN:}
primehr.notifications.reminders.enabled=${PRIMEHR_NOTIFICATION_REMINDERS_ENABLED:false}
primehr.notifications.reminders.lead-hours=${PRIMEHR_NOTIFICATION_REMINDER_LEAD_HOURS:24}
primehr.notifications.reminders.fixed-delay-millis=${PRIMEHR_NOTIFICATION_REMINDER_FIXED_DELAY_MILLIS:3600000}
primehr.notifications.reminders.maximum-batch-size=${PRIMEHR_NOTIFICATION_REMINDER_MAXIMUM_BATCH_SIZE:100}

primehr.administrative.base-url=${PRIMEHR_ADMINISTRATIVE_API_URL:http://localhost:8082}
primehr.administrative.connect-timeout-millis=${PRIMEHR_ADMINISTRATIVE_CONNECT_TIMEOUT_MILLIS:3000}
primehr.administrative.read-timeout-millis=${PRIMEHR_ADMINISTRATIVE_READ_TIMEOUT_MILLIS:5000}
primehr.human-resource.base-url=${PRIMEHR_HUMAN_RESOURCE_API_URL:http://localhost:8085}
primehr.human-resource.connect-timeout-millis=${PRIMEHR_HUMAN_RESOURCE_CONNECT_TIMEOUT_MILLIS:3000}
primehr.human-resource.read-timeout-millis=${PRIMEHR_HUMAN_RESOURCE_READ_TIMEOUT_MILLIS:5000}
primehr.integration.safe-read-max-attempts=${PRIMEHR_SAFE_READ_MAX_ATTEMPTS:2}
primehr.integration.safe-read-retry-delay-millis=${PRIMEHR_SAFE_READ_RETRY_DELAY_MILLIS:100}
primehr.reporting.minimum-aggregate-cohort=${PRIMEHR_REPORTING_MINIMUM_AGGREGATE_COHORT:5}

primehr.handoff.jwt-secret=${PRIMEHR_HANDOFF_JWT_SECRET:}
primehr.handoff.issuer=${PRIMEHR_HANDOFF_ISSUER:primehr}
primehr.handoff.audience=${PRIMEHR_HANDOFF_AUDIENCE:humanresource}
primehr.handoff.token-seconds=${PRIMEHR_HANDOFF_TOKEN_SECONDS:60}

primehr.cors.allowed-origins=${PRIMEHR_CORS_ALLOWED_ORIGINS:http://localhost:3086}
primehr.cors.allowed-origin-patterns=${PRIMEHR_CORS_ALLOWED_ORIGIN_PATTERNS:}
