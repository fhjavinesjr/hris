# PRIME-HR database provider selection.
# SQL Server is active below. To switch to PostgreSQL, comment the SQL Server
# provider block and uncomment the PostgreSQL provider block.

spring.application.name=PrimeHR
server.port=8086

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

primehr.security.jwt-secret=secret
primehr.applicant.enabled=${PRIMEHR_APPLICANT_ENABLED:false}
primehr.applicant.jwt-secret=${PRIMEHR_APPLICANT_JWT_SECRET:}
primehr.applicant.token-minutes=30
primehr.applicant.maximum-failed-attempts=5
primehr.applicant.lock-minutes=15
primehr.applicant.required-document-types=PDS
primehr.applicant.allow-reapplication-after-withdrawal=false
primehr.storage.enabled=false
primehr.storage.provider=local
primehr.storage.local-root=${PRIMEHR_DOCUMENT_ROOT:}
primehr.storage.maximum-bytes=10485760
primehr.storage.allowed-media-types=application/pdf,image/jpeg,image/png
primehr.storage.s3-bucket=${PRIMEHR_DOCUMENT_BUCKET:}
primehr.storage.s3-region=${PRIMEHR_DOCUMENT_REGION:ap-southeast-1}
primehr.storage.s3-endpoint=${PRIMEHR_DOCUMENT_ENDPOINT:}

primehr.security.competency-reader-roles=
primehr.agency.id=DEFAULT
primehr.administrative.base-url=http://localhost:8082
primehr.administrative.connect-timeout-millis=3000
primehr.administrative.read-timeout-millis=5000
primehr.human-resource.base-url=http://localhost:8085
primehr.human-resource.connect-timeout-millis=3000
primehr.human-resource.read-timeout-millis=5000
primehr.cors.allowed-origins=http://localhost:3086
primehr.cors.allowed-origin-patterns=

# SQL Server provider block (ACTIVE)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=primehr;encrypt=true;trustServerCertificate=true
spring.datasource.username=admin
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.flyway.locations=classpath:db/migration/sqlserver
spring.flyway.default-schema=dbo
spring.flyway.schemas=dbo
spring.flyway.placeholders.primehrSchema=dbo
spring.jpa.properties.hibernate.default_schema=dbo

