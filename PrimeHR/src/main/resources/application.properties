spring.application.name=PrimeHR
server.port=${PORT:8086}
spring.profiles.default=postgresql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

primehr.security.jwt-secret=${PRIMEHR_JWT_SECRET}
primehr.security.competency-reader-roles=${PRIMEHR_COMPETENCY_READER_ROLES:}
primehr.agency.id=${PRIMEHR_AGENCY_ID}
primehr.cors.allowed-origins=${PRIMEHR_CORS_ALLOWED_ORIGINS:http://localhost:3086}
primehr.cors.allowed-origin-patterns=${PRIMEHR_CORS_ALLOWED_ORIGIN_PATTERNS:}
