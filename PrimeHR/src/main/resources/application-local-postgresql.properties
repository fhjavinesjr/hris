primehr.security.jwt-secret=${PRIMEHR_JWT_SECRET:local-development-secret-change-before-production}
primehr.handoff.jwt-secret=${PRIMEHR_HANDOFF_JWT_SECRET:local-handoff-secret-change-before-production}

spring.datasource.url=${PRIMEHR_DB_URL:jdbc:postgresql://localhost:5432/primehr}
spring.datasource.username=${PRIMEHR_DB_USERNAME:primehr}
spring.datasource.password=${PRIMEHR_DB_PASSWORD:primehr}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.default-schema=${PRIMEHR_DB_SCHEMA:public}
spring.flyway.schemas=${PRIMEHR_DB_SCHEMA:public}
spring.flyway.placeholders.primehrSchema=${PRIMEHR_DB_SCHEMA:public}
spring.jpa.properties.hibernate.default_schema=${PRIMEHR_DB_SCHEMA:public}
