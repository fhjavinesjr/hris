spring.datasource.url=jdbc:h2:mem:primehr-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=PUBLIC
spring.flyway.enabled=false
primehr.security.jwt-secret=test-only-secret-with-at-least-32-characters
primehr.applicant.enabled=true
primehr.applicant.jwt-secret=test-only-applicant-secret-with-at-least-32-characters
primehr.applicant.required-document-types=PDS
primehr.applicant.allow-reapplication-after-withdrawal=false
primehr.storage.enabled=true
primehr.storage.provider=local
primehr.storage.local-root=${java.io.tmpdir}/primehr-test-documents
primehr.security.competency-reader-roles=COMPETENCY_READER
primehr.agency.id=TEST-AGENCY
primehr.administrative.base-url=http://localhost:18082
primehr.cors.allowed-origins=http://localhost:3086
