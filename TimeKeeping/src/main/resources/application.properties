# Server Configuration
server.port=8083
spring.application.name=TimeKeepingSoftware

# HRIS SQL Server database
spring.datasource.url=jdbc:sqlserver://localhost:1433;database=hrisof;trustServerCertificate=true;encrypt=true;
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=admin
spring.datasource.password=sa

spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ZKTeco/iClock ADMS import (SQL Server on-premises only)
adms.sync.enabled=true
adms.sync.database-name=adms_db
adms.sync.batch-size=1000
adms.sync.max-records-per-run=10000

# Automatic synchronization. The DTR page button remains temporarily for testing.
adms.sync.auto-enabled=true
adms.sync.initial-delay-ms=15000
adms.sync.interval-ms=60000

# ADMS punch interpretation and DTR processing
adms.dtr.enabled=true
adms.dtr.early-window-minutes=360
adms.dtr.late-window-minutes=480
adms.dtr.final-out-early-tolerance-minutes=120
adms.dtr.settle-grace-minutes=30
