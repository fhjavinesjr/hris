# Server Configuration
server.port = 8082
spring.application.name = AdministrativeSoftware

#logging.level.org.springframework=DEBUG

# DataSource Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;database=hrisof;user=admin;password=sa;trustServerCertificate=true;encrypt=true;
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=admin
spring.datasource.password=sa
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app.cors.allowed-origins=http://localhost:3087,http://localhost:3080,http://localhost:3081,http://localhost:3082,http://localhost:3083,http://localhost:3084,http://localhost:3085,http://192.168.68.128:3082,http://localhost:3086
app.cors.allowed-origin-patterns=https://*.vercel.app